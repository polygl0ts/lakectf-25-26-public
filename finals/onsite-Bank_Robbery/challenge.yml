# This file represents the base specification of your challenge. It is used by
# other tools to install and deploy your challenge.

# Required sections
name: "Bank Robery"
author: "Adam "
attribution: "Adam"
category: onsite misc hardware rev social-engineering
description: |
  New bank opened in the CTF room, they offer a vault where any customer can deposit their valuables, and might even contain a bank-only section inside too. First you need to become a customer, then you may attempt to rob the secret vault. 

  Gameplay information: 
  This challenge contains staff larping as different characters. In case of real issues, the safeword is 'celery'. 
  Say this and we will stop the acting and answer your questions. 

  Physically attacking the safe is not allowed. This includes but is not limited to making holes, pulling wires, unscrewing screws, stealing the whole box, shaking the whole box. In general, methods that leave the box fully functional are allowed, everything else is not. In case of doubt whether your method go ask the bank using safeword.

  PS: Resisting arrest is forbidden, and in case you are stuck it might be useful to go talk to the barman at Cyberia bar.

value: 100
type: dynamic

# The extra field provides additional fields for data during the install/sync commands/
# Fields in extra can be used to supply additional information for other challenge types
# For example the follow extra field is for dynamic challenges. To use these following
# extra fields, set the type to "dynamic" and uncomment the "extra" section below
extra:
  initial: 500
  decay: 209
  minimum: 100

# Settings used for Dockerfile deployment
# If not used, remove or set to null
