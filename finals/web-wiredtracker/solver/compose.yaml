services:
  solver:
    image: ghcr.io/astral-sh/uv:python3.14-alpine
    command: uv run --with requests /app/solve.py http://chall.polygl0ts.ch:8080 http://chall.polygl0ts.ch:8081
    volumes:
      - ./solve.py:/app/solve.py:ro
      - data:/downloads
    extra_hosts:
      - "chall.polygl0ts.ch:84.234.29.63" # temporary workaround before CTF start

  qbittorrent:
    image: 'linuxserver/qbittorrent:latest'
    environment:
      PUID: '1000'
      PGID: '1000'
      TZ: 'Etc/UTC'
      WEBUI_PORT: '8080'
    network_mode: "service:solver"
    volumes:
      - ./qBittorrent.conf:/config/qBittorrent/qBittorrent.conf:ro
      - data:/downloads

volumes:
  data:
